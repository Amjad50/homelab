## DYNAMIC CONFIGURATION

# HTTP Middlewares
http:
  middlewares:
    # Security headers (no TLS since we're behind tunnel)
    secure-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
          - "X-Forwarded-Proto"
        referrerPolicy: "same-origin"
        contentTypeNosniff: true
        browserXssFilter: true
        customFrameOptionsValue: "SAMEORIGIN"

    # Response compression for better performance
    compression:
      compress:
        minResponseBodyBytes: 1024
        excludedContentTypes:
          - "text/event-stream"
          - "application/grpc"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        period: 1m
        burst: 200

    default-chain:
      chain:
        middlewares:
          - secure-headers
          - compression

  # Routers
  routers:

  # Services
  services:
    