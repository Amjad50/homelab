name: ${DOCKER_NAME}

networks:
  traefik:
    external: true
  huly-internal:
    internal: true
  # Limited outbound path for services that must reach public endpoints:
  # Kanidm, GitHub, SMTP, and the Elasticsearch attachment plugin download.
  huly-egress:
    driver: bridge

volumes:
  elastic:
  redpanda:
  cr_data:
  cr_certs:

services:
  nginx:
    image: nginx:1.21.3
    restart: unless-stopped
    depends_on:
      account:
        condition: service_healthy
      collaborator:
        condition: service_healthy
      front:
        condition: service_healthy
      rekoni:
        condition: service_healthy
      stats:
        condition: service_healthy
      transactor:
        condition: service_healthy
    networks:
      - huly-internal
      - traefik
    volumes:
      - ./.huly.nginx:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.huly.rule=Host(`huly.home.amsh.dev`)"
      - "traefik.http.services.huly.loadbalancer.server.port=80"
      - "traefik.http.routers.huly.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    restart: unless-stopped
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    volumes:
      - cr_data:/cockroach/cockroach-data
      - cr_certs:/cockroach/certs
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --url=\"$${DB_URL}?sslmode=disable\" --format=tsv --execute='SHOW GRANTS ON DATABASE defaultdb' | grep -Eq '^defaultdb[[:space:]]+selfhost[[:space:]]+ALL'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    restart: unless-stopped
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped
    networks:
      - huly-internal
    volumes:
      - /mnt/storage/huly/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    restart: unless-stopped
    networks:
      - huly-internal
      - huly-egress
    volumes:
      - elastic:/usr/share/elasticsearch/data
    environment:
      ELASTICSEARCH_PORT_NUMBER: "9200"
      BITNAMI_DEBUG: "true"
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1024m -Xmx1024m"
      http.cors.enabled: "true"
      http.cors.allow-origin: http://localhost:8082
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
      interval: 20s
      retries: 10

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION}
    restart: unless-stopped
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    deploy:
      resources:
        limits:
          memory: 500M
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(4004,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      fulltext:
        condition: service_healthy
      stats:
        condition: service_healthy
      mail:
        condition: service_healthy
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    environment:
      SERVER_PORT: "3333"
      FRONT_URL: http://localhost:8087
      ACCOUNTS_URL: http://account:3000
      FULLTEXT_URL: http://fulltext:4700
      STATS_URL: http://stats:4900
      MAIL_URL: http://mail:8097
      LAST_NAME_FIRST: "true"
      QUEUE_CONFIG: redpanda:9092
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3333,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      account:
        condition: service_healthy
      minio:
        condition: service_healthy
      stats:
        condition: service_healthy
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    environment:
      COLLABORATOR_PORT: "3078"
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3078,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  account:
    image: hardcoreeng/account:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      stats:
        condition: service_healthy
      mail:
        condition: service_healthy
    networks:
      - huly-internal
      # OIDC discovery must reach the external Kanidm issuer. The internal
      # application network intentionally has no default route.
      - huly-egress
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    environment:
      SERVER_PORT: "3000"
      TRANSACTOR_URL: ws://transactor:3333;wss://huly.home.amsh.dev/_transactor
      FRONT_URL: https://huly.home.amsh.dev
      STATS_URL: http://stats:4900
      MAIL_URL: http://mail:8097
      MODEL_ENABLED: "*"
      ACCOUNTS_URL: https://huly.home.amsh.dev/_accounts
      ACCOUNT_PORT: "3000"
      QUEUE_CONFIG: redpanda:9092
      DISABLE_SIGNUP: "false"
      OPENID_CLIENT_ID: huly
      OPENID_ISSUER: https://idm.home.amsh.dev/oauth2/openid/huly
      OPENID_DISPLAY_NAME: Kanidm
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3000,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      account:
        condition: service_healthy
      transactor:
        condition: service_healthy
      stats:
        condition: service_healthy
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    environment:
      TRANSACTOR_URL: ws://transactor:3333;wss://huly.home.amsh.dev/_transactor
      MODEL_ENABLED: "*"
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      QUEUE_CONFIG: redpanda:9092

  front:
    image: hardcoreeng/front:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      account:
        condition: service_healthy
      minio:
        condition: service_healthy
      stats:
        condition: service_healthy
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
      - path: /var/lib/dock/huly-github-front.env
        required: true
    environment:
      SERVER_PORT: "8080"
      ACCOUNTS_URL: https://huly.home.amsh.dev/_accounts
      ACCOUNTS_URL_INTERNAL: http://account:3000
      REKONI_URL: https://huly.home.amsh.dev/_rekoni
      CALENDAR_URL: https://huly.home.amsh.dev/_calendar
      GMAIL_URL: https://huly.home.amsh.dev/_gmail
      GITHUB_URL: https://huly.home.amsh.dev/_github
      TELEGRAM_URL: https://huly.home.amsh.dev/_telegram
      STATS_URL: http://stats:4900
      LOVE_ENDPOINT: https://huly.home.amsh.dev/_love
      UPLOAD_URL: /files
      ELASTIC_URL: http://elastic:9200
      COLLABORATOR_URL: wss://huly.home.amsh.dev/_collaborator
      TITLE: Huly
      DEFAULT_LANGUAGE: en
      LAST_NAME_FIRST: "true"
      DESKTOP_UPDATES_CHANNEL: ${DESKTOP_CHANNEL}
      DISABLED_FEATURES: auto-translate,mailboxes
      HIDE_LOCAL_LOGIN: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(8080,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
      elastic:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      rekoni:
        condition: service_healthy
      stats:
        condition: service_healthy
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    environment:
      FULLTEXT_DB_URL: http://elastic:9200
      ELASTIC_INDEX_NAME: huly_storage_index
      REKONI_URL: http://rekoni:4004
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      QUEUE_CONFIG: redpanda:9092
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(4700,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  stats:
    image: hardcoreeng/stats:${HULY_VERSION}
    restart: unless-stopped
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    environment:
      PORT: "4900"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(4900,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  mail:
    image: hardcoreeng/mail:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      stats:
        condition: service_healthy
    networks:
      - huly-internal
      - huly-egress
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
      - path: /var/lib/dock/huly-mail.env
        required: true
    environment:
      PORT: "8097"
      SOURCE: huly@home.amsh.dev
      STATS_URL: http://stats:4900
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(8097,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  github:
    image: hardcoreeng/github:${HULY_VERSION}
    restart: unless-stopped
    depends_on:
      account:
        condition: service_healthy
      collaborator:
        condition: service_healthy
      minio:
        condition: service_healthy
      stats:
        condition: service_healthy
    networks:
      - huly-internal
      - huly-egress
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
      - path: /var/lib/dock/huly-github.env
        required: true
    environment:
      PORT: "3500"
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      COLLABORATOR_URL: ws://collaborator:3078
      FRONT_URL: https://huly.home.amsh.dev
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3500,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  kvs:
    image: hardcoreeng/hulykvs:${HULY_VERSION}
    depends_on:
      cockroach:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly-internal
    env_file:
      - path: /var/lib/dock/huly.env
        required: true
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8094'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
