networks:
  traefik:
    external: true
  fireflyiii:
    internal: true

secrets:
  firefly-app-key:
    file: /run/secrets/firefly-app-key
  firefly-db-password:
    file: /run/secrets/firefly-db-password

services:
  fireflyiii-db:
    image: postgres:15-alpine
    container_name: fireflyiii-db
    restart: unless-stopped
    networks:
      - fireflyiii
    secrets:
      - firefly-db-password
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD_FILE: /run/secrets/firefly-db-password
      TZ: "Asia/Kuala_Lumpur"
    volumes:
      - /mnt/storage/firefly/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 7s
    labels:
      - "sablier.enable=true"
      - "sablier.group=fireflyiii"

  fireflyiii:
    image: fireflyiii/core:latest
    container_name: fireflyiii
    restart: unless-stopped
    depends_on:
      fireflyiii-db:
        condition: service_healthy
    networks:
      - traefik
      - fireflyiii
    secrets:
      - firefly-app-key
      - firefly-db-password
    environment:
      TZ: "Asia/Kuala_Lumpur"
      DEFAULT_LANGUAGE: en_US
      DEFAULT_LOCALE: equal
      
      # App configuration
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY_FILE: /run/secrets/firefly-app-key
      APP_URL: https://firefly.home.amsh.dev
      TRUSTED_PROXIES: "*"
      
      # Database configuration
      DB_CONNECTION: pgsql
      DB_HOST: fireflyiii-db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD_FILE: /run/secrets/firefly-db-password
      ENABLE_EXCHANGE_RATES: true
    
      # Cache configuration
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      
      # Mail configuration (optional)
      MAIL_MAILER: log
      
      # Security
      COOKIE_SECURE: false
      
      # OIDC Authentication with Kanidm
      AUTHENTICATION_GUARD: remote_user_guard
      AUTHENTICATION_GUARD_HEADER: X-Auth-Request-Email
      AUTHENTICATION_GUARD_EMAIL: X-Auth-Request-Email
      
    volumes:
      - /mnt/storage/firefly/upload:/var/www/html/storage/upload
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.fireflyiii.rule=Host(`firefly.home.amsh.dev`)"
      - "traefik.http.routers.fireflyiii.service=fireflyiii"
      - "traefik.http.routers.fireflyiii.middlewares=default-chain@file,sablier-fireflyiii"
      # Sablier scale-to-zero. Wakes app + db together.
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.middlewares.sablier-fireflyiii.plugin.sablier.group=fireflyiii"
      - "traefik.http.middlewares.sablier-fireflyiii.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.sablier-fireflyiii.plugin.sablier.dynamic.displayName=Firefly III"
      - "traefik.http.services.fireflyiii.loadbalancer.server.port=8080"
      - "sablier.enable=true"
      - "sablier.group=fireflyiii"
