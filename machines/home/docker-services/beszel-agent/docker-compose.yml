secrets:
  beszel-hub-public-key:
    file: /run/secrets/beszel-hub-public-key
  beszel-home-agent-token:
    file: /run/secrets/beszel-home-agent-token

services:
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent-intel:latest
    restart: unless-stopped
    network_mode: host
    secrets:
      - beszel-hub-public-key
      - beszel-home-agent-token
    cap_add:
      - CAP_PERFMON
    environment:
      TZ: "Asia/Kuala_Lumpur"
      DATA_DIR: /var/lib/beszel-agent
      LISTEN: 45876
      HUB_URL: https://beszel.home.amsh.dev
      TOKEN_FILE: /run/secrets/beszel-home-agent-token
      KEY_FILE: /run/secrets/beszel-hub-public-key
      SYSTEM_NAME: home
      DISABLE_SSH: true
      FILESYSTEM: /
      DISK_USAGE_CACHE: 10m
      SERVICE_PATTERNS: "beszel*,docker*,restic*,rathole*,compose-*,homelab-*"
      EXCLUDE_CONTAINERS: "beszel-agent"
    volumes:
      - /mnt/storage/beszel-agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      - /mnt/storage/.beszel:/extra-filesystems/storage__Storage:ro
    devices:
      - /dev/dri/card1:/dev/dri/card1
