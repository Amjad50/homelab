networks:
  traefik:
    external: true
  media:
    internal: true

volumes:
  jellyfin-cache:
services:
  # Jellyfin - Media Server
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.home.amsh.dev
    volumes:
      - /mnt/storage/media/configs/jellyfin:/config
      - jellyfin-cache:/cache
      - /mnt/storage/media:/media:ro
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri # For hardware acceleration
    ports:
      - "8096:8096" # for local network access
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.home.amsh.dev`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Sonarr - TV Show Management
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/storage/media/configs/sonarr:/config
      - /mnt/storage/media/tv:/tv
      - /mnt/storage/media/downloads:/downloads
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.home.amsh.dev`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Radarr - Movie Management
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/storage/media/configs/radarr:/config
      - /mnt/storage/media/movies:/movies
      - /mnt/storage/media/downloads:/downloads
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.home.amsh.dev`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prowlarr - Indexer Management
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/storage/media/configs/prowlarr:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.home.amsh.dev`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Shelfmark - Book and audiobook search/request tool
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    networks:
      - traefik
      - media
    env_file:
      # Optional host-local secrets:
      # PROWLARR_API_KEY, QBITTORRENT_USERNAME, QBITTORRENT_PASSWORD
      - path: /var/lib/dock/shelfmark.env
        required: false
    environment:
      # Bootstrap
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - FLASK_PORT=8084
      - FLASK_HOST=0.0.0.0
      - CONFIG_DIR=/config
      - TMP_DIR=/tmp/shelfmark
      - DOCKERMODE=true

      # Library links
      - SEARCH_PAGE_TITLE=Shelfmark
      - CALIBRE_WEB_URL=https://calibre.home.amsh.dev
      - AUDIOBOOK_LIBRARY_URL=https://audiobooks.home.amsh.dev

      # Destinations
      - BOOKS_OUTPUT_MODE=folder
      - INGEST_DIR=/books
      - FILE_ORGANIZATION=rename
      - TEMPLATE_RENAME={Author} - {Title} ({Year})
      - DESTINATION_AUDIOBOOK=/audiobooks
      - FILE_ORGANIZATION_AUDIOBOOK=organize
      - TEMPLATE_AUDIOBOOK_ORGANIZE={Author}/{Title}/{Title}
      - QBITTORRENT_DOWNLOAD_DIR=/downloads
      - HARDLINK_TORRENTS_AUDIOBOOK=false

      # Existing media-stack integrations
      - PROWLARR_ENABLED=true
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_TORRENT_CLIENT=qbittorrent
      - PROWLARR_TORRENT_ACTION=keep
      - QBITTORRENT_URL=http://qbittorrent:8080
      - QBITTORRENT_CATEGORY=books
      - QBITTORRENT_CATEGORY_AUDIOBOOK=audiobooks
      - USE_CF_BYPASS=true
      - USING_EXTERNAL_BYPASSER=true
      - EXT_BYPASSER_URL=http://flaresolverr:8191
      - EXT_BYPASSER_PATH=/v1
      - EXT_BYPASSER_TIMEOUT=60000

      # Local networking
      - CERTIFICATE_VALIDATION=disabled_local
      - CUSTOM_DNS=system
      - USE_DOH=false
      - NO_PROXY=localhost,127.0.0.1,prowlarr,qbittorrent,flaresolverr,calibre-web-automated,audiobookshelf
    volumes:
      - /mnt/storage/media/configs/shelfmark:/config
      - /mnt/storage/media/calibre-ingest:/books
      - /mnt/storage/media/audiobooks:/audiobooks
      - /mnt/storage/media/downloads:/downloads
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shelfmark.rule=Host(`shelfmark.home.amsh.dev`)"
      - "traefik.http.services.shelfmark.loadbalancer.server.port=8084"
      - "traefik.http.routers.shelfmark.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 30s
      retries: 3

  # FlareSolverr - Bypass Cloudflare Protection
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/Kuala_Lumpur
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.home.amsh.dev`)"
      - "traefik.http.services.flaresolverr.loadbalancer.server.port=8191"
      - "traefik.http.routers.flaresolverr.middlewares=default-chain@file"

  # Jellyseerr - Request Management
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/storage/media/configs/jellyseerr:/app/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5055:5055" # for local network access
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.home.amsh.dev`)"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
      - "traefik.http.routers.jellyseerr.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # qBittorrent - Download Client
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - WEBUI_PORT=8080
    env_file:
      - path: /var/lib/dock/ntfy-client.env
        required: false
    volumes:
      - /mnt/storage/media/configs/qbittorrent:/config
      - /mnt/storage/media/downloads:/downloads
      - /etc/localtime:/etc/localtime:ro
      - /etc/homelab-scripts/homelab-notify.sh:/usr/local/bin/homelab-notify:ro
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.home.amsh.dev`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.http.routers.qbittorrent.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Bazarr - Subtitle Management
  bazarr:
    image: ghcr.io/amjad50/bazarr-alass:edge
    container_name: bazarr
    restart: unless-stopped
    networks:
      - traefik
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/storage/media/configs/bazarr:/config
      - /mnt/storage/media/movies:/movies
      - /mnt/storage/media/tv:/tv
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.home.amsh.dev`)"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.http.routers.bazarr.middlewares=default-chain@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
