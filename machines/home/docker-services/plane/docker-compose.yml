x-app-env: &app-env
  TZ: "Asia/Kuala_Lumpur"
  DEBUG: "0"
  WEB_URL: "https://plane.home.amsh.dev"
  APP_DOMAIN: "plane.home.amsh.dev"
  CORS_ALLOWED_ORIGINS: "https://plane.home.amsh.dev"
  GUNICORN_WORKERS: "1"
  API_KEY_RATE_LIMIT: "60/minute"

  # Database
  PGHOST: "plane-db"
  PGDATABASE: "plane"
  POSTGRES_USER: "plane"
  POSTGRES_DB: "plane"
  POSTGRES_PORT: "5432"
  PGDATA: "/var/lib/postgresql/data"
  # POSTGRES_PASSWORD, DATABASE_URL from env_file

  # Redis
  REDIS_HOST: "plane-redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://plane-redis:6379/"

  # RabbitMQ
  RABBITMQ_HOST: "plane-mq"
  RABBITMQ_PORT: "5672"
  # RABBITMQ_USER, RABBITMQ_PASSWORD, RABBITMQ_VHOST, AMQP_URL from env_file

  # Object storage (bundled MinIO)
  USE_MINIO: "1"
  MINIO_ENDPOINT_SSL: "0"
  AWS_REGION: ""
  AWS_S3_ENDPOINT_URL: "http://plane-minio:9000"
  AWS_S3_BUCKET_NAME: "uploads"
  FILE_SIZE_LIMIT: "5242880"
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY from env_file

  # Misc
  WEBHOOK_ALLOWED_IPS: ""
  WEBHOOK_ALLOWED_HOSTS: ""
  # SECRET_KEY, LIVE_SERVER_SECRET_KEY from env_file

networks:
  traefik:
    external: true
  plane:
    # NOT internal — api/worker need outbound HTTPS for GitHub OAuth callbacks,
    # GitHub sync, Unsplash, and SMTP. Isolation comes from no published ports
    # (only plane-proxy is on the traefik network).


services:
  plane-db:
    image: postgres:17-alpine
    container_name: plane-db
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    networks:
      - plane
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      TZ: "Asia/Kuala_Lumpur"
      POSTGRES_USER: "plane"
      POSTGRES_DB: "plane"
      PGDATA: "/var/lib/postgresql/data"
      # POSTGRES_PASSWORD from env file
    volumes:
      - /mnt/storage/plane/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  plane-redis:
    image: valkey/valkey:latest
    container_name: plane-redis
    restart: unless-stopped
    networks:
      - plane
    volumes:
      - /mnt/storage/plane/redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  plane-mq:
    image: rabbitmq:4-management-alpine
    container_name: plane-mq
    restart: unless-stopped
    networks:
      - plane
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      TZ: "Asia/Kuala_Lumpur"
      # RABBITMQ_DEFAULT_USER/PASS/VHOST come from the env file.
    volumes:
      - /mnt/storage/plane/rabbitmq:/var/lib/rabbitmq
      # Plane v1.3.1's Celery/kombu uses transient non-exclusive queues, which
      # RabbitMQ 4 deprecated. Re-permit them until upstream Plane migrates.
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/99-plane.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  plane-minio:
    image: minio/minio:latest
    container_name: plane-minio
    restart: unless-stopped
    networks:
      - plane
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      TZ: "Asia/Kuala_Lumpur"
      # MINIO_ROOT_USER/PASSWORD come from the env file.
    command: server /export --console-address ":9090"
    volumes:
      - /mnt/storage/plane/minio:/export
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  migrator:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    container_name: plane-migrator
    restart: "no"
    networks:
      - plane
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      <<: *app-env
    volumes:
      - /mnt/storage/plane/logs/migrator:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  api:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    container_name: plane-api
    restart: unless-stopped
    networks:
      - plane
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      <<: *app-env
    volumes:
      - /mnt/storage/plane/logs/api:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8000/api/instances/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    container_name: plane-worker
    restart: unless-stopped
    networks:
      - plane
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      <<: *app-env
    volumes:
      - /mnt/storage/plane/logs/worker:/code/plane/logs
    depends_on:
      api:
        condition: service_started
      plane-mq:
        condition: service_healthy

  beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    container_name: plane-beat-worker
    restart: unless-stopped
    networks:
      - plane
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      <<: *app-env
    volumes:
      - /mnt/storage/plane/logs/beat-worker:/code/plane/logs
    depends_on:
      api:
        condition: service_started
      plane-mq:
        condition: service_healthy

  web:
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.3.1}
    container_name: plane-web
    restart: unless-stopped
    networks:
      - plane
    depends_on:
      api:
        condition: service_started

  space:
    image: makeplane/plane-space:${APP_RELEASE:-v1.3.1}
    container_name: plane-space
    restart: unless-stopped
    networks:
      - plane
    depends_on:
      api:
        condition: service_started

  admin:
    image: makeplane/plane-admin:${APP_RELEASE:-v1.3.1}
    container_name: plane-admin
    restart: unless-stopped
    networks:
      - plane
    depends_on:
      api:
        condition: service_started

  live:
    image: makeplane/plane-live:${APP_RELEASE:-v1.3.1}
    container_name: plane-live
    restart: unless-stopped
    networks:
      - plane
    env_file:
      - path: /var/lib/dock/plane.env
        required: true
    environment:
      TZ: "Asia/Kuala_Lumpur"
      API_BASE_URL: "http://api:8000"
      REDIS_HOST: "plane-redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://plane-redis:6379/"
      # LIVE_SERVER_SECRET_KEY from env file (must match api's value)
    depends_on:
      api:
        condition: service_started

  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.3.1}
    container_name: plane-proxy
    restart: unless-stopped
    networks:
      - traefik
      - plane
    environment:
      TZ: "Asia/Kuala_Lumpur"
      APP_DOMAIN: "plane.home.amsh.dev"
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: "uploads"
      TRUSTED_PROXIES: "0.0.0.0/0"
      LISTEN_HTTP_PORT: "80"
      LISTEN_HTTPS_PORT: "443"
      CERT_EMAIL: ""
      CERT_ACME_CA: "https://acme-v02.api.letsencrypt.org/directory"
      CERT_ACME_DNS: ""
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      space:
        condition: service_started
      admin:
        condition: service_started
      live:
        condition: service_started
      plane-minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane.rule=Host(`plane.home.amsh.dev`)"
      - "traefik.http.routers.plane.service=plane"
      - "traefik.http.routers.plane.middlewares=default-chain@file"
      - "traefik.http.services.plane.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
