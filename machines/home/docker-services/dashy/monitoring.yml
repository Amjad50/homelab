pageInfo:
  title: System monitoring
  description: A dashboard for monitoring the home server
sections:
  - name: Cpu
    icon: fas fa-microchip
    widgets:
      - type: gl-current-cpu
        options:
          useProxy: true
          hostname: http://glances:61208
        id: 0_296_glcurrentcpu
      - type: gl-current-cores
        options:
          useProxy: true
          hostname: http://glances:61208
        id: 1_296_glcurrentcores
    displayData:
      rows: 3
      cols: 1
  - name: Cpu History
    icon: fas fa-microchip
    widgets:
      - type: gl-cpu-history
        options:
          useProxy: true
          hostname: http://glances:61208
          limit: 500
        id: 0_1082_glcpuhistory
    displayData:
      rows: 1
      cols: 2
  - name: Memory
    icon: fas fa-memory
    widgets:
      - type: gl-current-mem
        options:
          useProxy: true
          hostname: http://glances:61208
        id: 0_633_glcurrentmem
  - name: Memory History
    icon: fas fa-memory
    widgets:
      - type: gl-mem-history
        options:
          useProxy: true
          hostname: http://glances:61208
          limit: 500
        id: 0_1419_glmemhistory
  - name: Disk
    icon: fas fa-hdd
    widgets:
      - type: gl-disk-space
        options:
          useProxy: true
          hostname: http://glances:61208
        id: 0_395_gldiskspace
  - name: System Load History
    icon: fas fa-tachometer-alt
    widgets:
      - type: gl-load-history
        options:
          useProxy: true
          hostname: http://glances:61208
        id: 0_1847_glloadhistory
  - name: Network Traffic
    icon: fas fa-network-wired
    widgets:
      - type: gl-network-traffic
        options:
          useProxy: true
          hostname: http://glances:61208
          limit: 1000
        id: 0_1481_glnetworktraffic
  - name: Today
    icon: far fa-calendar-day
    widgets:
      - type: clock
        options:
          format: en-US
        id: 0_513_clock
      - type: public-ip
        id: 1_513_publicip