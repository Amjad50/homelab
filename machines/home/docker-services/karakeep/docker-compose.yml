networks:
  traefik:
    external: true
  karakeep:
    internal: true
  chrome:
    external: false

volumes:
  meilisearch:

services:
  web:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    volumes:
      - /mnt/storage/karakeep/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik
      - karakeep
    env_file:
      - path: /var/lib/dock/karakeep.env
        required: true
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      NEXTAUTH_URL: https://karakeep.home.amsh.dev
      DISABLE_NEW_RELEASE_CHECK: "true"
      DB_WAL_MODE: "true"
      DISABLE_PASSWORD_AUTH: "true"
      OAUTH_WELLKNOWN_URL: "https://idm.home.amsh.dev/oauth2/openid/karakeep/.well-known/openid-configuration"
      OAUTH_CLIENT_ID: "karakeep"
      # OAUTH_CLIENT_SECRET: set from env file
      OAUTH_SCOPE: "openid profile email"
      OAUTH_PROVIDER_NAME: "Kanidm"
      OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
      OCR_LANGS: "eng,ara"
      CRAWLER_NUM_WORKERS: 4
      SEARCH_NUM_WORKERS: 4
      ASSET_PREPROCESSING_NUM_WORKERS: 2
      # OPENAI_API_KEY: set from env file
      OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
      INFERENCE_TEXT_MODEL: "google/gemini-2.0-flash-001"
      INFERENCE_IMAGE_MODEL: "google/gemini-2.0-flash-001"
      INFERENCE_CONTEXT_LENGTH: 8192
      INFERENCE_ENABLE_AUTO_TAGGING: "true"
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"

      DATA_DIR: /data
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.karakeep.rule=Host(`karakeep.home.amsh.dev`)"
      - "traefik.http.routers.karakeep.service=karakeep"
      - "traefik.http.routers.karakeep.middlewares=default-chain@file"
      - "traefik.http.services.karakeep.loadbalancer.server.port=3000"
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    container_name: karakeep-chrome
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    networks:
      - karakeep
      - chrome
  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    container_name: karakeep-meilisearch
    env_file:
      - path: /var/lib/dock/karakeep.env
        required: true
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data
    networks:
      - karakeep

