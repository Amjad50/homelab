---
services:
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    user: 1000:1000
    networks:
      - opencloud
      - traefik
    entrypoint:
      - /bin/sh
    # run opencloud init to initialize a configuration file with random secrets
    command: ["-c", "opencloud init || true && opencloud server"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      tika:
        condition: service_healthy
    environment:
      # enable services that are not started automatically
      OC_ADD_RUN_SERVICES: "antivirus"
      OC_ENABLE_OCM: "true"
      # Kanidm is the external IdP; OpenCloud still runs IDM for its internal LDAP user store.
      # search runs as its own container (the bleve indexer OOM-killed the process)
      OC_EXCLUDE_RUN_SERVICES: "idp,search"
      OC_URL: https://opencloud.home.amsh.dev
      STORAGE_USERS_DRIVER: "posix"
      STORAGE_USERS_ID_CACHE_STORE: "nats-js-kv"
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      OC_LOG_LEVEL: info
      OC_LOG_COLOR: true
      OC_LOG_PRETTY: true
      # do not use SSL between the reverse proxy and OpenCloud
      PROXY_TLS: "false"
      # INSECURE: needed if OpenCloud / reverse proxy is using self generated certificates
      OC_INSECURE: false
      # basic auth (not recommended, but needed for eg. WebDav clients that do not support OpenID Connect)
      PROXY_ENABLE_BASIC_AUTH: false
      FRONTEND_ARCHIVER_MAX_SIZE: "10000000000"
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
      # cap fulltext extraction per file; default 20MB was too generous for this box
      SEARCH_CONTENT_EXTRACTION_SIZE_LIMIT: "10485760"
      # control the password enforcement and policy for public shares
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: false
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: false
      # OIDC
      OC_OIDC_ISSUER: "https://idm.home.amsh.dev/oauth2/openid/opencloud"
      PROXY_ROLE_ASSIGNMENT_DRIVER: "oidc"
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: "oc_role"
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
      GRAPH_USERNAME_MATCH: "none"
      WEB_OIDC_CLIENT_ID: opencloud
      WEBFINGER_WEB_OIDC_CLIENT_ID: opencloud
      # Kanidm exposes each OAuth client under a separate issuer path. Since
      # OpenCloud advertises the opencloud issuer, all clients must use that
      # same Kanidm OAuth client id.
      WEBFINGER_ANDROID_OIDC_CLIENT_ID: opencloud
      WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES: "openid,profile,email,groups,offline_access"
      WEBFINGER_DESKTOP_OIDC_CLIENT_ID: opencloud
      WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: "openid,profile,email,groups,offline_access"
      WEBFINGER_IOS_OIDC_CLIENT_ID: opencloud
      WEBFINGER_IOS_OIDC_CLIENT_SCOPES: "openid,profile,email,groups,offline_access"
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: "none"
      PROXY_OIDC_SKIP_USER_INFO: "false"
      WEB_OIDC_SCOPE: "openid profile email groups offline_access"
      PROXY_USER_OIDC_CLAIM: "preferred_username"
      PROXY_USER_CS3_CLAIM: "username"
      PROXY_AUTOPROVISION_CLAIM_EMAIL: 'email'
      PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME: 'name'
      PROXY_AUTOPROVISION_CLAIM_USERNAME: "preferred_username"
      PROXY_AUTOPROVISION_CLAIM_GROUPS: 'groups'
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      WEB_OIDC_POST_LOGOUT_REDIRECT_URI: 'https://opencloud.home.amsh.dev'
      # fulltext search (indexer runs in the `search` container; this is the UI flag)
      FRONTEND_FULL_TEXT_SEARCH_ENABLED: "true"
      # antivirus
      # virusscan disabled 2026-06-12: the antivirus service treats a NATS publish
      # timeout as FATAL and exits, and the saturated event bus (main-queue +
      # KV_eventhistory ~66k msgs each) made those timeouts constant → ~70s
      # crash-loop + upload 404s. Empty steps = postprocessing is an instant no-op,
      # so uploads finalize without a scan that can fail. Re-add "virusscan" only
      # after the event-bus saturation is addressed.
      POSTPROCESSING_STEPS: ""
      STORAGE_USERS_DATA_GATEWAY_URL: "http://opencloud:9200/data"
      ANTIVIRUS_MAX_SCAN_SIZE: 100MB
      ANTIVIRUS_INFECTED_FILE_HANDLING: abort
      ANTIVIRUS_MAX_SCAN_SIZE_MODE: partial
      ANTIVIRUS_WORKERS: 1
      ANTIVIRUS_CLAMAV_SOCKET: /var/run/clamav/clamd.sock
      ANTIVIRUS_SCANNER_TYPE: clamav
      # office collaboration
      ONLYOFFICE_DOMAIN: onlyoffice.home.amsh.dev
      # expose nats and the reva gateway for the collaboration service
      NATS_NATS_HOST: 0.0.0.0
      GATEWAY_GRPC_ADDR: 0.0.0.0:9142

    volumes:
      - /mnt/storage/opencloud/config:/etc/opencloud
      - /mnt/storage/opencloud/data:/var/lib/opencloud
      - ./config/opencloud/csp.yaml:/etc/opencloud/csp.yaml
      - ./config/opencloud/proxy.yaml:/etc/opencloud/proxy.yaml
      - ./config/opencloud/apps:/var/lib/opencloud/web/assets/apps
      - clamav-socket:/var/run/clamav
    # ~15 internal Go services + embedded NATS + antivirus worker
    # (ANTIVIRUS_MAX_SCAN_SIZE 100MB x ANTIVIRUS_WORKERS 1 x factor 8-14 ≈ 0.8-1.4G)
    # memswap_limit == mem_limit: no swap, clean OOM kill instead of host thrash
    mem_limit: 5g
    memswap_limit: 5g
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opencloud.rule=Host(`opencloud.home.amsh.dev`)"
      - "traefik.http.services.opencloud.loadbalancer.server.port=9200"
  
  # Search service
  tika:
    image: apache/tika:latest-full
    networks:
      - opencloud
    # JVM sizes its heap from the container limit (UseContainerSupport)
    mem_limit: 1.5g
    memswap_limit: 1.5g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9998'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Antivirus service
  clamav:
    image: clamav/clamav:latest
    environment:
      # Accepts a number with optional K, M or G suffix. Must be greater or equal to ANTIVIRUS_MAX_SCAN_SIZE above.
      # K = KiB (1024), M = MiB (1024 * 1024), G = GiB (1024 * 1024 * 1024)
      CLAMD_CONF_StreamMaxLength: 100M
      # default (yes) doubles memory (~2.6G) during signature reloads; serial reload stays ~1.3G
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    networks:
      - opencloud
      - clamav-egress
    volumes:
      - clamav-socket:/tmp
      - clamav-db:/var/lib/clamav
    # signature DB ~1.3G resident; serial reload (above) keeps the spike inside this cap
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
  
  # Full-text search indexer, isolated so a bleve memory spike only restarts
  # this container. Joins the mesh like the collaboration service below.
  search:
    image: opencloudeu/opencloud-rolling:latest
    user: 1000:1000
    networks:
      - opencloud
    depends_on:
      opencloud:
        condition: service_started
      tika:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command: [ "-c", "opencloud search server" ]
    environment:
      MICRO_REGISTRY: "nats-js-kv"
      MICRO_REGISTRY_ADDRESS: "opencloud:9233"
      # point event/store endpoints at the main NATS (default 127.0.0.1 = self here)
      OC_EVENTS_ENDPOINT: "opencloud:9233"
      OC_CACHE_STORE_NODES: "opencloud:9233"
      OC_PERSISTENT_STORE_NODES: "opencloud:9233"
      # bind GRPC on all interfaces so the main process can reach it via the registry
      SEARCH_GRPC_ADDR: "0.0.0.0:9220"
      OC_URL: https://opencloud.home.amsh.dev
      OC_LOG_LEVEL: info
      OC_LOG_COLOR: true
      OC_LOG_PRETTY: true
      STORAGE_USERS_DATA_GATEWAY_URL: "http://opencloud:9200/data"
      SEARCH_EXTRACTOR_TYPE: tika
      SEARCH_EXTRACTOR_TIKA_TIKA_URL: http://tika:9998
      # cap fulltext extraction per file; default 20MB was too generous for this box
      SEARCH_CONTENT_EXTRACTION_SIZE_LIMIT: "10485760"
      GOGC: "50"
    volumes:
      - /mnt/storage/opencloud/config:/etc/opencloud
      - /mnt/storage/opencloud/data:/var/lib/opencloud
    # caps a bleve spike to this container instead of the whole process
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped

  # Office collaboration service
  collaboration:
    image: opencloudeu/opencloud-rolling:latest
    user: 1000:1000
    networks:
      - opencloud
      - traefik
    depends_on:
      opencloud:
        condition: service_started
      onlyoffice:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command: [ "-c", "opencloud collaboration server" ]
    environment:
      COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
      COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
      MICRO_REGISTRY: "nats-js-kv"
      MICRO_REGISTRY_ADDRESS: "opencloud:9233"
      COLLABORATION_WOPI_SRC: http://collaboration:9300
      COLLABORATION_APP_NAME: "OnlyOffice"
      COLLABORATION_APP_PRODUCT: "OnlyOffice"
      COLLABORATION_APP_ADDR: https://onlyoffice.home.amsh.dev
      COLLABORATION_APP_ICON: https://onlyoffice.home.amsh.dev/web-apps/apps/documenteditor/main/resources/img/favicon.ico
      COLLABORATION_APP_INSECURE: false
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: false
      OC_URL: https://opencloud.home.amsh.dev
    volumes:
      - /mnt/storage/opencloud/config:/etc/opencloud
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
  
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    networks:
      - opencloud
      - traefik
    entrypoint:
      - /bin/sh
      - /entrypoint-override.sh
    environment:
      WOPI_ENABLED: "true"
      # self-signed certificates
      USE_UNAUTHORIZED_STORAGE: false
    volumes:
      - ./config/onlyoffice/entrypoint-override.sh:/entrypoint-override.sh
      - /var/lib/dock/opencloud/onlyoffice-local.json:/etc/onlyoffice/documentserver/local.dist.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onlyoffice.rule=Host(`onlyoffice.home.amsh.dev`)"
      # websockets can't be opened when this is omitted
      - "traefik.http.middlewares.onlyoffice.headers.customrequestheaders.X-Forwarded-Proto=https"
      # CSP to allow embedding onlyoffice in ocis
      - "traefik.http.middlewares.onlyoffice.headers.contentSecurityPolicy=frame-ancestors 'self' https://opencloud.home.amsh.dev"
      - "traefik.http.routers.onlyoffice.middlewares=onlyoffice"
    # asset-cache regen on container recreate is CPU/memory heavy
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/hosting/discovery"]


volumes:
  clamav-db:
  clamav-socket:

networks:
  traefik:
    external: true
  opencloud:
    internal: true
  clamav-egress:
