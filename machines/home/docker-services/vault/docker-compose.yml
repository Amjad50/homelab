networks:
  traefik:
    external: true

services:
  vault:
    image: hashicorp/vault:2.0.0
    container_name: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    user: "100:100"
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    networks:
      - traefik
    environment:
      SKIP_SETCAP: "1"
      TZ: "Asia/Kuala_Lumpur"
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/storage/vault:/vault/file
      - ./config:/vault/config:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`vault.home.amsh.dev`)"
      - "traefik.http.routers.vault.middlewares=default-chain@file"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "vault status >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  vault-bootstrap:
    image: hashicorp/vault:2.0.0
    container_name: vault-bootstrap
    restart: on-failure
    depends_on:
      vault:
        condition: service_started
    networks:
      - traefik
    environment:
      TZ: "Asia/Kuala_Lumpur"
      VAULT_ADDR: "http://vault:8200"
    env_file:
      - path: /var/lib/dock/vault-bootstrap.env
        required: true
    command: sh /bootstrap-oidc.sh
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./bootstrap-oidc.sh:/bootstrap-oidc.sh:ro
