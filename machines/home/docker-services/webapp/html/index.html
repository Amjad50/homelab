<!DOCTYPE html>
<html>
<head>
    <title>Home Server Web App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .status { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Home Server Web Application</h1>
        <p class="status">✅ Rathole proxy is working!</p>
        <p>This service is running on the home server behind NAT and proxied through the middle server via rathole.</p>
        <hr>
        <p><strong>Architecture:</strong> Internet → Middle Server → Rathole Tunnel → Home Server → Docker Container</p>
    </div>
</body>
</html>
