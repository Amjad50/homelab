networks:
  default:
    name: webapp-net
    driver: bridge

services:
  webapp:
    image: nginx:alpine
    container_name: webapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3