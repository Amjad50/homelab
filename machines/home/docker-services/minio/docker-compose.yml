networks:
  traefik:
    external: true
  minio:
    internal: true

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    networks:
      - traefik
      - minio
    volumes:
      # Store all MinIO data (buckets, objects, config) in persistent storage
      - /mnt/storage/minio/data:/data
    env_file:
      - path: /var/lib/dock/minio.env
        required: true
    environment:
      TZ: "Asia/Kuala_Lumpur"
      MINIO_BROWSER_REDIRECT_URL: "https://minio-console.home.amsh.dev"
      MINIO_SERVER_URL: "https://minio.home.amsh.dev"
      MINIO_ROOT_USER: admin
      # MINIO_ROOT_PASSWORD: set from env file
    command: server /data
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # MinIO API Service (S3 Compatible)
      - "traefik.http.routers.minio-api.rule=Host(`minio.home.amsh.dev`)"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.routers.minio-api.middlewares=default-chain@file"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  console:
    image: ghcr.io/georgmangold/console
    container_name: minio-console
    restart: unless-stopped
    networks:
      - traefik
      - minio
    environment:
      TZ: "Asia/Kuala_Lumpur"
      CONSOLE_MINIO_SERVER: "http://minio:9000"
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # MinIO Console Service
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.home.amsh.dev`)"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.routers.minio-console.middlewares=default-chain@file"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9090"
