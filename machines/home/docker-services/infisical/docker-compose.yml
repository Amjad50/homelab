networks:
  traefik:
    external: true
  infisical:
    internal: true

services:
  infisical-db:
    image: postgres:17-alpine
    container_name: infisical-db
    restart: unless-stopped
    networks:
      - infisical
    env_file:
      - path: /var/lib/dock/infisical.env
        required: true
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      # POSTGRES_PASSWORD: set from env file
      TZ: "Asia/Kuala_Lumpur"
    volumes:
      - /mnt/storage/infisical/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    networks:
      - infisical
    environment:
      TZ: "Asia/Kuala_Lumpur"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    networks:
      - traefik
      - infisical
    env_file:
      - path: /var/lib/dock/infisical.env
        required: true
    environment:
      NODE_ENV: production
      # DB_CONNECTION_URI: set from env file
      # REDIS_URL: set from env file
      # ENCRYPTION_KEY: set from env file
      # AUTH_SECRET: set from env file
      # INF_APP_CONNECTION_GITHUB_OAUTH_CLIENT_ID: set from env file
      # INF_APP_CONNECTION_GITHUB_OAUTH_CLIENT_SECRET: set from env file
      SITE_URL: "https://infisical.home.amsh.dev"
      INVITE_ONLY_SIGNUP: "true"
      TZ: "Asia/Kuala_Lumpur"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.infisical.rule=Host(`infisical.home.amsh.dev`)"
      - "traefik.http.routers.infisical.middlewares=default-chain@file"
      - "traefik.http.services.infisical.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
