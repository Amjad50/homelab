

networks:
  traefik:
    external: true
  linkwarden:
    internal: true

services:
  linkwarden-db:
    image: postgres:17-alpine
    container_name: linkwarden-db
    restart: unless-stopped
    networks:
      - linkwarden
    env_file:
      - path: /var/lib/dock/linkwarden.env
        required: true
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      # POSTGRES_PASSWORD: set from env file
      TZ: "Asia/Kuala_Lumpur"
    volumes:
      - /mnt/storage/linkwarden/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden -d linkwarden"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=linkwarden"
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    restart: unless-stopped
    env_file:
      - path: /var/lib/dock/linkwarden.env
        required: true
    environment:
      NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "false"
      # NEXTAUTH_SECRET: set from env file
      NEXTAUTH_URL: "https://linkwarden.home.amsh.dev/api/v1/auth"
      NEXT_PUBLIC_AUTHELIA_ENABLED: "true"
      AUTHELIA_CUSTOM_NAME: "Kanidm"
      AUTHELIA_WELLKNOWN_URL: "https://idm.home.amsh.dev/oauth2/openid/linkwarden/.well-known/openid-configuration"
      AUTHELIA_CLIENT_ID: "linkwarden"
      # AUTHELIA_CLIENT_SECRET: set from env file
      # DATABASE_URL: set from env file
      CUSTOM_OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
      OPENAI_MODEL: "google/gemini-2.0-flash-001"
      # OPENAI_API_KEY: set from env file
    volumes:
      - /mnt/storage/linkwarden/data:/data/data
    networks:
      - traefik
      - linkwarden
    depends_on:
      linkwarden-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linkwarden.rule=Host(`linkwarden.home.amsh.dev`)"
      - "traefik.http.routers.linkwarden.service=linkwarden"
      - "traefik.http.routers.linkwarden.middlewares=default-chain@file,sablier-linkwarden"
      # Sablier scale-to-zero. Wakes app + db together.
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.middlewares.sablier-linkwarden.plugin.sablier.group=linkwarden"
      - "traefik.http.middlewares.sablier-linkwarden.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.sablier-linkwarden.plugin.sablier.dynamic.displayName=Linkwarden"
      - "traefik.http.services.linkwarden.loadbalancer.server.port=3000"
      - "sablier.enable=true"
      - "sablier.group=linkwarden"


