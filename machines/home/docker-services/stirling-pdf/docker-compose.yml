
networks:
  traefik:
    external: true

volumes:
  tessdata:

services:
  tessdata-downloader:
    image: alpine:latest
    volumes:
      - tessdata:/usr/share/tessdata
    command: |
      sh -c '
        if [ ! -f /usr/share/tessdata/.downloaded ]; then
          apk add --no-cache wget
          cd /usr/share/tessdata
          wget -q https://github.com/tesseract-ocr/tessdata/raw/main/ara.traineddata
          wget -q https://github.com/tesseract-ocr/tessdata/raw/main/jpn.traineddata
          touch .downloaded
        fi
      '
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    depends_on:
      tessdata-downloader:
        condition: service_completed_successfully
    networks:
      - traefik
    volumes:
      - tessdata:/usr/share/tessdata # Required for extra OCR languages
      - /var/log/stirlingpdf:/logs/
      # - ./StirlingPDF/customFiles:/customFiles/
      # - ./StirlingPDF/pipeline:/pipeline/
    environment:
      # OAuth2 SSO moved to paid tier; auth is now handled by oauth2-proxy at
      # the middle traefik (pdf.home.amsh.dev falls through to home-fallback).
      - DISABLE_ADDITIONAL_FEATURES=false
      - LANGS=en_US
      - SECURITY_ENABLELOGIN=false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/info/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # JVM cold start can take ~30s; give it room before sablier marks the
      # wake as failed.
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.stirlingpdf.loadbalancer.server.port=8080"
      - "traefik.http.routers.stirlingpdf.rule=Host(`pdf.home.amsh.dev`)"
      - "traefik.http.routers.stirlingpdf.middlewares=default-chain@file,sablier-stirling-pdf"
      # Sablier scale-to-zero. JVM cold start is ~15s so we use a slower
      # refresh frequency on the loading page.
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.middlewares.sablier-stirling-pdf.plugin.sablier.names=stirling-pdf"
      - "traefik.http.middlewares.sablier-stirling-pdf.plugin.sablier.dynamic.displayName=Stirling PDF"
      - "traefik.http.middlewares.sablier-stirling-pdf.plugin.sablier.dynamic.refreshFrequency=3s"