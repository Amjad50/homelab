networks:
  traefik:
    external: true

volumes:
  kanidm_data:

services:
  kanidm-cert-init:
    image: alpine:latest
    container_name: kanidm-cert-init
    volumes:
      - kanidm_data:/data
      - ./generate-certs.sh:/generate-certs.sh:ro
    environment:
      DOMAIN: "idm.home.amsh.dev"
    command: sh /generate-certs.sh

  kanidm:
    image: kanidm/server:latest
    container_name: kanidm
    restart: unless-stopped
    depends_on:
      kanidm-cert-init:
        condition: service_completed_successfully
    networks:
      - traefik
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/server.toml:/data/server.toml:ro
      # Reskin kanidm's Bootstrap UI to match the admin-ui design (orange).
      - ./config/override.css:/hpkg/override.css:ro
      - kanidm_data:/data
    environment:
      TZ: "Asia/Kuala_Lumpur"
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.kanidm.rule=Host(`idm.home.amsh.dev`)"
      - "traefik.http.routers.kanidm.service=kanidm"
      - "traefik.http.services.kanidm.loadbalancer.server.port=8443"
      - "traefik.http.services.kanidm.loadbalancer.server.scheme=https"
      - "traefik.http.services.kanidm.loadbalancer.serverstransport=kanidm-transport@file"
  admin-ui:
    image: ghcr.io/amjad50/kanidm-admin-ui:latest
    container_name: kanidm-admin-ui
    restart: unless-stopped
    environment:
      TZ: "Asia/Kuala_Lumpur"
      KANIDM_ADMIN_KANIDM_URL: "https://idm.home.amsh.dev"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanidm-admin.rule=Host(`idm.home.amsh.dev`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.kanidm-admin.priority=1000"
      - "traefik.http.services.kanidm-admin.loadbalancer.server.port=3000"

