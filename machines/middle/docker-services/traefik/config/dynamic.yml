## DYNAMIC CONFIGURATION

# HTTP Middlewares
http:
  middlewares:
    # Security headers
    secure-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
          - "X-Forwarded-Proto"
          - "X-Forwarded-Port"
        referrerPolicy: "same-origin"
        sslRedirect: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        customFrameOptionsValue: "SAMEORIGIN"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        period: 1m
        burst: 200

    # IP whitelist for internal services
    internal-whitelist:
      ipAllowList:
        sourceRange:
          - "10.0.0.0/8"      # Private networks
          - "192.168.0.0/16"  # Private networks
          - "172.16.0.0/12"   # Docker networks
          - "127.0.0.1/32"    # Localhost
          - "10.8.0.0/24"     # WireGuard VPN subnet

    # Chain multiple middlewares
    default-chain:
      chain:
        middlewares:
          - secure-headers
          - rate-limit

    internal-chain:
      chain:
        middlewares:
          - secure-headers
          - internal-whitelist

  # Custom routers
  routers:
    # FireflyIII API bypass (higher priority)
    firefly-api-bypass:
      rule: "Host(`firefly.home.alsharafi.dev`) && (HeaderRegexp(`Authorization`, `Bearer .+`) || HeaderRegexp(`X-API-Key`, `.+`) || Query(`api_token`, `.+`))"
      service: "home-tunnel"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "home.alsharafi.dev"
            sans:
              - "firefly.home.alsharafi.dev"
      priority: 100
    
    # Services which have their own authentication
    # and may need to bypass OAuth2
    home-public-sso:
      rule: "Host(`blinko.home.alsharafi.dev`) || Host(`memos.home.alsharafi.dev`) || Host(`minio.home.alsharafi.dev`) || Host(`jellyfin.home.alsharafi.dev`) || Host(`karakeep.home.alsharafi.dev`) || Host(`linkwarden.home.alsharafi.dev`) || Host(`pdf.home.alsharafi.dev`) || Host(`books.home.alsharafi.dev`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "home.alsharafi.dev"
            sans:
              - "blinko.home.alsharafi.dev"
              - "memos.home.alsharafi.dev"
              - "minio.home.alsharafi.dev"
              - "jellyfin.home.alsharafi.dev"
              - "karakeep.home.alsharafi.dev"
              - "linkwarden.home.alsharafi.dev"
              - "pdf.home.alsharafi.dev"
              - "books.home.alsharafi.dev"
      priority: 10

    # Fallback route for all other *.home.alsharafi.dev domains (protected by OAuth2)
    home-fallback:
      rule: "HostRegexp(`^.+\\.home\\.alsharafi\\.dev$`) || Host(`home.alsharafi.dev`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "home.alsharafi.dev"
            sans:
              - "wud.home.alsharafi.dev"
              - "webapp.home.alsharafi.dev"
              - "traefik-internal.home.alsharafi.dev"
              - "firefly.home.alsharafi.dev"
              - "debug-internal.home.alsharafi.dev"
              - "minio-console.home.alsharafi.dev"
              - "n8n.home.alsharafi.dev"
              - "solidtime.home.alsharafi.dev"
              - "sonarr.home.alsharafi.dev"
              - "radarr.home.alsharafi.dev"
              - "prowlarr.home.alsharafi.dev"
              - "jellyseerr.home.alsharafi.dev"
              - "bazarr.home.alsharafi.dev"
              - "qbittorrent.home.alsharafi.dev"
              - "glances.home.alsharafi.dev"
              - "filebrowser.home.alsharafi.dev"
              - "sync.home.alsharafi.dev"
      middlewares:
        - oauth2-auth@docker
      priority: 1

    ping:
      rule: "PathPrefix(`/ping`)"
      service: "ping@internal"
      entryPoints:
        - ping

  # Custom services
  services:
    # Tunnel service for fallback routing
    home-tunnel:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"

  serversTransports:
    kanidm-transport:
      insecureSkipVerify: true
