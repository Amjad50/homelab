## DYNAMIC CONFIGURATION

# HTTP Middlewares
http:
  middlewares:
    # Security headers
    secure-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
          - "X-Forwarded-Proto"
          - "X-Forwarded-Port"
        referrerPolicy: "same-origin"
        sslRedirect: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        customFrameOptionsValue: "SAMEORIGIN"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        period: 1m
        burst: 200

    # IP whitelist for internal services
    internal-whitelist:
      ipAllowList:
        sourceRange:
          - "10.0.0.0/8" # Private networks
          - "192.168.0.0/16" # Private networks
          - "172.16.0.0/12" # Docker networks
          - "127.0.0.1/32" # Localhost
          - "10.8.0.0/24" # WireGuard VPN subnet

    # Chain multiple middlewares
    default-chain:
      chain:
        middlewares:
          - secure-headers
          - rate-limit

    internal-chain:
      chain:
        middlewares:
          - secure-headers
          - internal-whitelist

  # Custom routers
  routers:
    # FireflyIII API bypass (higher priority)
    firefly-api-bypass:
      rule: "Host(`firefly.home.amsh.dev`) && (HeaderRegexp(`Authorization`, `Bearer .+`) || HeaderRegexp(`X-API-Key`, `.+`) || Query(`api_token`, `.+`))"
      service: "home-tunnel"
      entryPoints:
        - websecure
      priority: 100

    # Solidtime PWA
    solidtime-favicons-bypass:
      rule: "Host(`solidtime.home.amsh.dev`) && PathPrefix(`/favicons`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      priority: 100

    # Services which have their own authentication
    # and may need to bypass OAuth2
    home-public-sso:
      rule: "Host(`blinko.home.amsh.dev`) || Host(`memos.home.amsh.dev`) || Host(`minio.home.amsh.dev`) || Host(`jellyfin.home.amsh.dev`) || Host(`linkwarden.home.amsh.dev`) || Host(`pdf.home.amsh.dev`) || Host(`books.home.amsh.dev`) || Host(`audiobooks.home.amsh.dev`) || Host(`upsnap.home.amsh.dev`) || Host(`rss.home.amsh.dev`) || Host(`immich.home.amsh.dev`) || Host(`n8n.home.amsh.dev`) || Host(`infisical.home.amsh.dev`) || Host(`beszel.home.amsh.dev`) || Host(`opencloud.home.amsh.dev`) || Host(`onlyoffice.home.amsh.dev`) || Host(`calibre.home.amsh.dev`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      priority: 10

    # Fallback route for all other *.home.amsh.dev domains (protected by OAuth2)
    home-fallback:
      rule: "HostRegexp(`^.+\\.home\\.amsh\\.dev$`) || Host(`home.amsh.dev`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: "home.amsh.dev"
            sans:
              - "wud.home.amsh.dev"
              - "traefik-internal.home.amsh.dev"
              - "firefly.home.amsh.dev"
              - "debug-internal.home.amsh.dev"
              - "dockge-internal.home.amsh.dev"
              - "minio-console.home.amsh.dev"
              - "solidtime.home.amsh.dev"
              - "sonarr.home.amsh.dev"
              - "radarr.home.amsh.dev"
              - "prowlarr.home.amsh.dev"
              - "jellyseerr.home.amsh.dev"
              - "bazarr.home.amsh.dev"
              - "qbittorrent.home.amsh.dev"
              - "glances.home.amsh.dev"
              - "filebrowser.home.amsh.dev"
              - "sync.home.amsh.dev"
              - "it-tools.home.amsh.dev"
              - "vert.home.amsh.dev"
              - "cyberchef.home.amsh.dev"
              - "opencloud.home.amsh.dev"
              - "onlyoffice.home.amsh.dev"
      middlewares:
        - oauth2-auth@docker
      priority: 1

    ping:
      rule: "PathPrefix(`/ping`)"
      service: "ping@internal"
      entryPoints:
        - ping

  # Custom services
  services:
    # Tunnel service for fallback routing
    home-tunnel:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"

  serversTransports:
    kanidm-transport:
      insecureSkipVerify: true
