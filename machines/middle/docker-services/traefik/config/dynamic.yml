## DYNAMIC CONFIGURATION

# HTTP Middlewares
http:
  middlewares:
    # Security headers
    secure-headers:
      headers:
        hostsProxyHeaders:
          - "X-Forwarded-Host"
          - "X-Forwarded-Proto"
          - "X-Forwarded-Port"
        referrerPolicy: "same-origin"
        sslRedirect: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        customFrameOptionsValue: "SAMEORIGIN"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        period: 1m
        burst: 200

    # IP whitelist for internal services
    internal-whitelist:
      ipAllowList:
        sourceRange:
          - "10.0.0.0/8" # Private networks
          - "192.168.0.0/16" # Private networks
          - "127.0.0.1/32" # Localhost
          - "10.8.0.0/24" # WireGuard VPN subnet (wg-easy)
          - "100.64.0.0/10" # headscale mesh (v4)
          - "fd7a:115c:a1e0::/48" # headscale mesh (v6)
          - "100.97.0.0/16" # NetBird
          - "fd42:ba4b:da3d:8f27::/64" # NetBird
          - "149.118.147.243/32" # middle's own public ip

    # CORS for the NetBird management API. The dashboard bakes in one absolute
    # API endpoint (netbird.leaf-svc.cc), so loading the dashboard from the
    # alternate host (netbird.home.amsh.dev) makes cross-origin /api calls. The
    # management server emits no Access-Control-Allow-Origin itself, so add it
    # here for both dashboard origins.
    netbird-api-cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        # Explicit headers (not "*"): the spec forbids wildcard when credentials
        # are allowed, and the dashboard sends Authorization + Content-Type.
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
        accessControlAllowOriginList:
          - "https://netbird.leaf-svc.cc"
          - "https://netbird.home.amsh.dev"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true

    # Chain multiple middlewares
    default-chain:
      chain:
        middlewares:
          - secure-headers
          - rate-limit

    internal-chain:
      chain:
        middlewares:
          - secure-headers
          - internal-whitelist

  # Custom routers
  routers:
    # FireflyIII API bypass (higher priority)
    firefly-api-bypass:
      rule: "Host(`firefly.home.amsh.dev`) && (HeaderRegexp(`Authorization`, `Bearer .+`) || HeaderRegexp(`X-API-Key`, `.+`) || Query(`api_token`, `.+`))"
      service: "home-tunnel"
      entryPoints:
        - websecure
      priority: 100

    # Solidtime PWA
    solidtime-favicons-bypass:
      rule: "Host(`solidtime.home.amsh.dev`) && PathPrefix(`/favicons`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      priority: 100

    # Services which have their own authentication
    # and may need to bypass OAuth2
    home-public-sso:
      rule: "Host(`blinko.home.amsh.dev`) || Host(`memos.home.amsh.dev`) || Host(`minio.home.amsh.dev`) || Host(`jellyfin.home.amsh.dev`) || Host(`linkwarden.home.amsh.dev`) || Host(`books.home.amsh.dev`) || Host(`audiobooks.home.amsh.dev`) || Host(`upsnap.home.amsh.dev`) || Host(`rss.home.amsh.dev`) || Host(`immich.home.amsh.dev`) || Host(`n8n.home.amsh.dev`) || Host(`infisical.home.amsh.dev`) || Host(`beszel.home.amsh.dev`) || Host(`opencloud.home.amsh.dev`) || Host(`onlyoffice.home.amsh.dev`) || Host(`calibre.home.amsh.dev`) || Host(`norish.home.amsh.dev`) || Host(`plane.home.amsh.dev`) || Host(`debug-internal.home.amsh.dev`) || Host(`huly.home.amsh.dev`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      priority: 10

    # Fallback route for all other *.home.amsh.dev domains (protected by OAuth2)
    home-fallback:
      rule: "HostRegexp(`^.+\\.home\\.amsh\\.dev$`) || Host(`home.amsh.dev`)"
      service: "home-tunnel"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: "home.amsh.dev"
            sans:
              - "wud.home.amsh.dev"
              - "traefik-internal.home.amsh.dev"
              - "firefly.home.amsh.dev"
              - "debug-internal.home.amsh.dev"
              - "dockge-internal.home.amsh.dev"
              - "minio-console.home.amsh.dev"
              - "solidtime.home.amsh.dev"
              - "sonarr.home.amsh.dev"
              - "radarr.home.amsh.dev"
              - "prowlarr.home.amsh.dev"
              - "jellyseerr.home.amsh.dev"
              - "bazarr.home.amsh.dev"
              - "qbittorrent.home.amsh.dev"
              - "filebrowser.home.amsh.dev"
              - "sync.home.amsh.dev"
              - "it-tools.home.amsh.dev"
              - "vert.home.amsh.dev"
              - "cyberchef.home.amsh.dev"
              - "opencloud.home.amsh.dev"
              - "onlyoffice.home.amsh.dev"
              - "shelfmark.home.amsh.dev"
              - "pdf.home.amsh.dev"
      middlewares:
        - oauth2-auth@docker
      priority: 1

    # Traefik dashboard
    traefik-dashboard:
      rule: "Host(`traefik.home.amsh.dev`)"
      service: "api@internal"
      entryPoints:
        - websecure
      priority: 100
      middlewares:
        - oauth2-auth@docker

    ping:
      rule: "PathPrefix(`/ping`)"
      service: "ping@internal"
      entryPoints:
        - ping

  # Custom services
  services:
    # Tunnel service for fallback routing
    home-tunnel:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"

  serversTransports:
    kanidm-transport:
      insecureSkipVerify: true
