global:
  sendAnonymousUsage: false
  checkNewVersion: false

api:
  dashboard: true
  debug: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          # permanent: true

  websecure:
    address: ":443"
    asDefault: true
    http:
      tls:
        certResolver: cloudflare

  ping:
    address: ":8082"

providers:
  # File provider for dynamic configuration
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

  # Docker provider
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik
    watch: true

# Certificate resolvers
certificatesResolvers:
  cloudflare:
    acme:
      email: amjadsharafi10@gmail.com
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

# Logging
log:
  level: INFO
  filePath: /data/logs/traefik.log
  format: json

accessLog:
  filePath: /data/logs/access.log
  format: json
  filters:
    statusCodes:
      - "400-499"
      - "500-599"
  fields:
    headers:
      defaultMode: drop # drop all headers per default
      names:
          User-Agent: keep # log user agent strings

# Metrics
# metrics:
#   prometheus:
#     addEntryPointsLabels: true
#     addServicesLabels: true
#     addRoutersLabels: true

# Ping for health checks
ping:
  entryPoint: ping
  manualRouting: true
