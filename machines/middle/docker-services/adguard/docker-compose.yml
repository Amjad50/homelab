networks:
  traefik:
    external: true

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    hostname: adguard
    restart: unless-stopped
    networks:
      - traefik
    ports:
      - "127.0.0.1:5300:53/udp"
      - "127.0.0.1:5300:53/tcp"
    volumes:
      - /storage/adguard/work:/opt/adguardhome/work
      - /storage/adguard/conf:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # First setup
      - "traefik.http.routers.adguard-init.rule=Host(`dns-initial.home.amsh.dev`)"
      - "traefik.http.routers.adguard-init.middlewares=default-chain@file,oauth2-auth@docker"
      - "traefik.http.routers.adguard-init.service=adguard-init"
      - "traefik.http.services.adguard-init.loadbalancer.server.port=3000"

      # DOH query
      - "traefik.http.routers.adguard-query.rule=Host(`dns.home.amsh.dev`) && PathPrefix(`/dns-query`)"
      - "traefik.http.routers.adguard-query.service=adguard"
      - "traefik.http.routers.adguard-query.middlewares=default-chain@file"

      # Main
      - "traefik.http.routers.adguard.rule=Host(`dns.home.amsh.dev`)"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"
      - "traefik.http.routers.adguard.service=adguard"
      - "traefik.http.routers.adguard.middlewares=default-chain@file,oauth2-auth@docker"

  # Used to enable DoH on the configs and restart the container
  adguard-configurator:
    build:
      context: .
      dockerfile: adguard-configurator.Dockerfile
    container_name: adguard-configurator
    environment:
      - SERVER_NAME=dns.home.amsh.dev
      - CONFIG_PATH=/config/AdGuardHome.yaml
      - ADGUARD_CONTAINER_NAME=adguard
    volumes:
      - /storage/adguard/conf:/config:rw
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      adguard:
        condition: service_started
    restart: "no"
