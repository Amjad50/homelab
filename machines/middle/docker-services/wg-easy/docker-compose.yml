volumes:
  etc_wireguard:

networks:
  bridge-net:
    name: bridge-net
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
  traefik:
    external: true
  

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wg.rule=Host(`wg.home.amsh.dev`)"
      - "traefik.http.services.wg.loadbalancer.server.port=51821"
      - "traefik.http.routers.wg.middlewares=default-chain@file,oauth2-auth@docker"
    environment:
      - LANG=en
      - PORT=51821
      - HOST=0.0.0.0
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"  # WireGuard VPN port (keep exposed)
    networks:
      - traefik
      - bridge-net
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    extra_hosts:
    - "host.docker.internal:host-gateway"