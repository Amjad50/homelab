networks:
  traefik:
    external: true

secrets:
  oauth2-proxy-client-secret:
    file: /run/secrets/oauth2-proxy-client-secret

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    restart: unless-stopped
    user: "nobody:nobody"
    networks:
      - traefik
    secrets:
      - oauth2-proxy-client-secret
    env_file:
      - /var/lib/dock/oauth2-proxy.env
    environment:
      TZ: "Asia/Kuala_Lumpur"
      # OAuth2 Proxy configuration
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      
      # OIDC Provider (Kanidm on home server via tunnel)
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_SCOPE: "openid email groups"
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: "Kanidm"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://idm.home.alsharafi.dev/oauth2/openid/oauth2-proxy"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
      OAUTH2_PROXY_CLIENT_ID: "oauth2-proxy"
      OAUTH2_PROXY_CLIENT_SECRET_FILE: "/run/secrets/oauth2-proxy-client-secret"
      OAUTH2_PROXY_REDIRECT_URL: "https://oauth2.home.alsharafi.dev/oauth2/callback"
      
      # Cookie settings
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_proxy"
      #OAUTH2_PROXY_COOKIE_SECRET: set via env file
      OAUTH2_PROXY_COOKIE_DOMAINS: ".home.alsharafi.dev"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_EXPIRE: "168h"  # 7 days
      
      # Security
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".home.alsharafi.dev"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

      
      # Logging
      OAUTH2_PROXY_REQUEST_LOGGING: "true"
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2-proxy.rule=Host(`oauth2.home.alsharafi.dev`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.service=oauth2-proxy"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"

      
      # OAuth2 Proxy auth middleware (for protecting other services)
      - "traefik.http.middlewares.oauth2-auth.forwardauth.address=http://oauth2-proxy:4180"
      - "traefik.http.middlewares.oauth2-auth.forwardauth.trustforwardheader=true"
      - "traefik.http.middlewares.oauth2-auth.forwardauth.authresponseheaders=X-Auth-Request-Access-Token,X-Auth-Request-Email,Authorization"
